<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaizen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mundo vivo a pantalla completa con cámara libre; paneles de papel del manual flotando encima. Hiru y Yoru para la interfaz; el mundo tiene su propio día y su propia noche. */
:root {
  --bg: #F2ECE4; --elev: #EBE4D8; --text: #2C2C2C; --accent: #8B2C20; --border: #C8BFA8; --muted: #9E9589; --bambu: #7A8B5A;
  --glass: rgba(235, 228, 216, .93);
  --f-title: 'Cormorant Garamond', Georgia, serif;
  --f-body: 'Inter', 'Helvetica Neue', Helvetica, sans-serif;
  --f-data: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1A1612; --elev: #221D18; --text: #E8E0D0; --accent: #C84134; --border: #3A3328; --muted: #6B6158; --glass: rgba(34, 29, 24, .93); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1A1612; --elev: #221D18; --text: #E8E0D0; --accent: #C84134; --border: #3A3328; --muted: #6B6158; --glass: rgba(34, 29, 24, .93); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.55 var(--f-body); padding: 0 16px; }
.app { max-width: 1480px; margin: 0 auto; padding-block: 12px 20px; display: grid; gap: 10px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
.brand img { width: 46px; height: 45px; mix-blend-mode: multiply; }
:root[data-theme="dark"] .brand img { filter: invert(1) hue-rotate(180deg); mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand img { filter: invert(1) hue-rotate(180deg); mix-blend-mode: screen; } }
.brand b { display: block; font: 700 28px/1 var(--f-title); letter-spacing: .14em; }
.brand small { display: block; font: italic 500 15px/1.2 var(--f-title); color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-left: auto; align-items: baseline; }
.stat small { display: block; font: 500 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 500 15px var(--f-data); font-variant-numeric: tabular-nums; }
.stat b.hot { color: var(--accent); }
.stat select { font: 500 15px var(--f-data); background: transparent; color: var(--text); border: 0; border-bottom: 1px solid var(--border); padding: 0 2px; max-width: 160px; }
.alive { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
.alive i { width: 8px; height: 8px; border-radius: 50%; background: var(--bambu); display: inline-block; }
.alive[data-s="off"] i { background: var(--muted); }
.alive[data-s="stop"] { color: var(--accent); font-weight: 600; }
.alive[data-s="stop"] i { background: var(--accent); }
.stop { color: var(--accent); font-weight: 600; letter-spacing: .04em; position: relative; }
.stop.armed { text-decoration-color: currentColor; }
.stop.armed::after, .yes.armed::after { content: ''; position: absolute; left: 0; bottom: -2px; height: 2px; background: currentColor; width: 0; animation: hold var(--hold, .8s) linear forwards; }
@keyframes hold { to { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .stop.armed::after, .yes.armed::after { animation: none; width: 100%; } }

.play { position: relative; }
.stage { position: relative; height: clamp(520px, calc(100vh - 104px), 980px); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #1b2250; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
.stage canvas.drag { cursor: grabbing; }
.stage canvas#gl { pointer-events: none; }
.stage canvas.hot { cursor: pointer; }

.side { background: var(--glass); border: 1px solid var(--border); border-radius: 6px; min-width: 0; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.tabs { display: flex; gap: 14px; padding: 10px 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { font: 500 13px var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 0 8px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.panel-body { padding: 14px; max-height: 470px; overflow-y: auto; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.feed li { font-size: 13.5px; padding-left: 12px; border-left: 2px solid transparent; }
.feed li.dir { border-left-color: var(--accent); animation: ink .3s cubic-bezier(.3, .7, .4, 1); }
.feed .who { font-weight: 600; }
.feed .meta { font: 400 11px var(--f-data); color: var(--muted); margin-top: 2px; }
@keyframes ink { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.team { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.link { font: 500 13px var(--f-body); color: var(--text); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; text-decoration-thickness: 1px; transition: text-decoration-color .2s; }
.link:hover { text-decoration-color: currentColor; }
.link .d { font-family: var(--f-data); color: var(--muted); font-size: 11px; margin-left: 4px; }
.h { font: 700 22px/1.15 var(--f-title); margin: 0 0 2px; }
.sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.mono { font-family: var(--f-data); font-size: 12.5px; }
.bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--text); border-radius: 2px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.profile { padding: 16px; display: grid; gap: 14px; }
.pf-top { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.portrait { width: 72px; height: 92px; border: 1px solid var(--border); border-radius: 6px; background: #cfe3ef; display: grid; place-items: center; overflow: hidden; }
.portrait canvas { width: 64px; height: 112px; image-rendering: pixelated; margin-top: 18px; }
.state { font: 400 12px var(--f-data); color: var(--muted); margin-top: 4px; }
.x { font: 400 20px/1 var(--f-body); background: none; color: var(--muted); border: 0; width: 28px; height: 28px; cursor: pointer; }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.stats2 label { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.stats2 label span:last-child { font-family: var(--f-data); color: var(--text); }
.box { border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 6px; }
.box h3 { font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.msgs { display: grid; gap: 8px; max-height: 150px; overflow-y: auto; font-size: 13px; }
.msgs .me { color: var(--muted); }
.msgs .me b, .msgs .ag b { color: var(--text); font-weight: 600; }
.msgs .ag.dir { border-left: 2px solid var(--accent); padding-left: 10px; animation: ink .3s cubic-bezier(.3, .7, .4, 1); }
.ask { display: flex; gap: 10px; align-items: center; }
.ask input { flex: 1; min-width: 0; font: 400 13px var(--f-body); color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--border); padding: 6px 0; }
.quick { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px 18px; border-top: 1px solid var(--border); padding-top: 10px; }
.link:focus-visible, .tab:focus-visible, .x:focus-visible, .ask input:focus-visible, .yes:focus-visible, .brand:focus-visible, .stage canvas:focus-visible { outline: 1px solid var(--text); outline-offset: 3px; border-radius: 4px; }
.cmd { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: center; align-items: center; padding: 8px 16px; background: var(--glass); border: 1px solid var(--border); border-radius: 6px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.cmd .sep { color: var(--border); }
.drawer { background: var(--elev); border: 1px solid var(--border); border-radius: 6px; padding: 18px; display: grid; gap: 14px; }
.drawer header { display: flex; align-items: baseline; gap: 12px; }
.drawer header .x { margin-left: auto; }
.card { border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 10px; }
.card h4 { margin: 0; font: 600 15px var(--f-body); }
.card .tag { font: 500 11px var(--f-data); color: var(--muted); }
.card .st { font: 500 12px var(--f-data); color: var(--muted); }
.yes { position: relative; }
.empty { font: italic 500 16px var(--f-title); color: var(--muted); margin: 6px 0; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.ok { background: var(--bambu); } .dot.warn { background: #b8862b; } .dot.bad { background: var(--accent); }
.warn { font: italic 500 15px var(--f-title); }
.decide { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 4px; }
.yes { font: 600 16px var(--f-body); background: var(--accent); color: #F2ECE4; border: 0; border-radius: 6px; padding: 12px 34px; cursor: pointer; }
.no { font: 600 16px var(--f-body); padding: 12px 20px; }
.inscr { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font: italic 500 24px var(--f-title); color: #fff8ec; text-align: center; max-width: min(80%, 620px); pointer-events: none; transition: opacity .4s; text-shadow: 0 0 10px rgba(20, 16, 12, .9), 0 0 3px rgba(20, 16, 12, .9); z-index: 6; }
.inscr.off { opacity: 0; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: italic 500 26px var(--f-title); color: #fff8ec; background: linear-gradient(#3b3a63, #7a5a86 70%, #d9a27a); z-index: 9; text-shadow: 0 0 8px rgba(20, 16, 12, .6); }
.plus { position: absolute; font: 600 18px var(--f-data); color: var(--muted); pointer-events: none; animation: rise .55s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }
body.muda .side, body.muda .cmd, body.muda .stats { display: none !important; }

@media (min-width: 1100px) {
  .side.left { position: absolute; left: 12px; top: 12px; width: 290px; max-height: calc(100% - 84px); display: flex; flex-direction: column; z-index: 3; }
  .side.left .panel-body { max-height: none; flex: 1; }
  .side.right { position: absolute; right: 12px; top: 12px; width: 320px; max-height: calc(100% - 84px); overflow-y: auto; z-index: 3; }
  .cmd { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); z-index: 3; }
  .drawer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 40px)); max-height: calc(100% - 40px); overflow-y: auto; z-index: 5; }
}
@media (max-width: 1099px) {
  .play { display: grid; gap: 10px; }
  .stage { height: 72vw; min-height: 290px; max-height: 70vh; order: 0; }
  .cmd { order: 1; } .drawer { order: 2; } .side.right { order: 3; } .side.left { order: 4; }
  .stats { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .feed li.dir, .msgs .ag.dir, .plus { animation: none; } .inscr { transition: none; } }

.stage:fullscreen { height: 100vh; border: 0; border-radius: 0; }

/* ===== estética de anime: curvas, cristal de sakura, botones en píldora y brillo suave. Solo forma y color; los ids y la estructura no cambian. ===== */
:root { --f-title: 'Shippori Mincho B1', 'Cormorant Garamond', Georgia, serif; --f-body: 'Zen Maru Gothic', 'Inter', 'Helvetica Neue', Helvetica, sans-serif; --gold: #d9a441; --sakura: #f3b6c8; --rad: 22px;
  --glass: rgba(250, 242, 236, .86); --ring: linear-gradient(135deg, rgba(243,182,200,.9), rgba(217,164,65,.8) 55%, rgba(255,255,255,.9)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --glass: rgba(28, 24, 40, .82); --gold: #e6b955; } }
:root[data-theme="dark"] { --glass: rgba(28, 24, 40, .82); --gold: #e6b955; }
body { background: radial-gradient(1200px 500px at 50% -10%, rgba(243,182,200,.35), transparent 70%), radial-gradient(900px 500px at 100% 100%, rgba(122,139,90,.16), transparent 70%), var(--bg); }
.brand b { font-weight: 700; letter-spacing: .2em; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.brand img { filter: drop-shadow(0 2px 6px rgba(139,44,32,.25)); }
.alive { padding: 5px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--border); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.alive i { box-shadow: 0 0 0 3px rgba(122,139,90,.22), 0 0 10px rgba(122,139,90,.7); animation: latido 2.4s ease-in-out infinite; }
.alive[data-s="off"] i, .alive[data-s="stop"] i { box-shadow: none; animation: none; }
@keyframes latido { 50% { transform: scale(1.25); } }
.stats .stat { padding: 2px 12px; border-radius: 14px; background: rgba(255,255,255,.28); }
.stage { border: 0; border-radius: 30px; box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 4px rgba(217,164,65,.55), 0 18px 50px rgba(40,30,60,.28), inset 0 0 60px rgba(20,14,40,.25); }
.stage::after { content: ''; position: absolute; inset: 0; border-radius: 30px; pointer-events: none; box-shadow: inset 0 0 90px 10px rgba(30,20,60,.32); z-index: 2; }
.side { border: 0; border-radius: var(--rad); box-shadow: 0 10px 34px rgba(30,20,50,.22), inset 0 0 0 1.5px rgba(255,255,255,.55); background: var(--glass); backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3); overflow: hidden; }
.side::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: var(--ring); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .7; pointer-events: none; }
.tabs { gap: 6px; padding: 12px 12px 10px; border-bottom: 0; }
.tab { border: 0; border-radius: 999px; padding: 5px 13px; transition: background .2s, color .2s, transform .15s; }
.tab:hover { background: rgba(243,182,200,.3); transform: translateY(-1px); }
.tab[aria-selected="true"] { background: linear-gradient(135deg, var(--accent), #c8553f); color: #fff6ee; box-shadow: 0 3px 10px rgba(139,44,32,.35); }
.feed li { border-left: 0; padding: 8px 12px; border-radius: 16px; background: rgba(255,255,255,.35); }
.feed li.dir { background: linear-gradient(90deg, rgba(243,182,200,.45), rgba(255,255,255,.3)); box-shadow: inset 3px 0 0 var(--accent); }
.team .link, .quick .link, .acts .link { padding: 3px 11px; border-radius: 999px; background: rgba(255,255,255,.4); text-decoration: none; transition: background .2s, transform .15s; }
.team .link:hover, .quick .link:hover, .acts .link:hover { background: rgba(243,182,200,.55); transform: translateY(-1px); }
.cmd { border: 0; border-radius: 999px; padding: 7px 14px; gap: 2px 4px; box-shadow: 0 12px 34px rgba(30,20,50,.32), inset 0 0 0 1.5px rgba(255,255,255,.6); backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3); }
.cmd .sep { display: none; }
.cmd .link { padding: 6px 13px; border-radius: 999px; text-decoration: none; position: relative; overflow: hidden; transition: background .2s, transform .15s, box-shadow .2s; }
.cmd .link:hover { background: rgba(243,182,200,.5); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(139,44,32,.18); }
.cmd .link:active { transform: translateY(0) scale(.97); }
.cmd #b-rin { color: var(--gold); font-family: var(--f-data); letter-spacing: .04em; }
.cmd .stop { background: rgba(139,44,32,.1); }
.stop.armed::after, .yes.armed::after { inset: 0; height: auto; bottom: 0; border-radius: inherit; background: rgba(200,65,52,.4); }
.yes.armed::after { background: rgba(255,255,255,.3); }
.profile { padding: 18px; }
.portrait { border: 0; border-radius: 26px; background: radial-gradient(circle at 50% 30%, #fff6e6, #cfe3ef 70%); box-shadow: 0 6px 16px rgba(30,20,50,.2), inset 0 0 0 2px rgba(255,255,255,.7); }
.box { border-top: 0; background: rgba(255,255,255,.3); border-radius: 18px; padding: 12px 14px; }
.box h3 { color: var(--accent); }
.bar { height: 7px; border-radius: 99px; background: rgba(0,0,0,.08); overflow: hidden; }
.bar i { border-radius: 99px; background: linear-gradient(90deg, var(--bambu), #b8d27a); }
.ask input { border: 0; background: rgba(255,255,255,.55); border-radius: 999px; padding: 8px 14px; }
.x { border-radius: 50%; background: rgba(0,0,0,.06); transition: background .2s, transform .2s; }
.x:hover { background: rgba(139,44,32,.18); transform: rotate(90deg); }
.drawer { border: 0; border-radius: 30px; background: var(--glass); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); box-shadow: 0 24px 70px rgba(30,20,50,.45), inset 0 0 0 2px rgba(255,255,255,.6); padding: 22px; }
.card { border-top: 0; background: rgba(255,255,255,.4); border-radius: 22px; padding: 16px 18px; box-shadow: 0 4px 14px rgba(30,20,50,.08); }
.yes { border-radius: 999px; background: linear-gradient(135deg, #c8412f, #e8734f); box-shadow: 0 6px 18px rgba(200,65,52,.45), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .15s, box-shadow .2s; overflow: hidden; }
.yes:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 24px rgba(200,65,52,.5), inset 0 1px 0 rgba(255,255,255,.4); }
.no { border-radius: 999px; }
.inscr { padding: 10px 24px; border-radius: 999px; background: rgba(28,22,48,.42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.28), inset 0 0 0 1.5px rgba(255,255,255,.3); text-shadow: 0 0 14px rgba(255,220,160,.7); font-size: 21px; }
.dot { box-shadow: 0 0 8px currentColor; }
.stats select { border-radius: 99px; border: 1px solid var(--border); padding: 1px 8px; }
::-webkit-scrollbar { width: 9px; } ::-webkit-scrollbar-thumb { background: rgba(139,44,32,.3); border-radius: 99px; } ::-webkit-scrollbar-track { background: transparent; }

/* ===== «Mientras no estabas» (resumen real de lo que pasó desde tu última visita) y la carta escondida ===== */
.alba { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 6; width: min(440px, calc(100% - 32px)); padding: 18px 22px 16px; border-radius: 28px; background: var(--glass); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); box-shadow: 0 20px 60px rgba(30,20,50,.4), inset 0 0 0 2px rgba(255,255,255,.6); animation: albaIn .7s cubic-bezier(.2,.8,.2,1); }
@keyframes albaIn { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } }
.alba h3 { font: 700 20px/1.2 var(--f-title); margin: 0 0 2px; } .alba .sub { margin-bottom: 8px; }
.alba ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; } .alba li { padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,.4); font-size: 13.5px; } .alba li b { font-family: var(--f-data); }
.alba .acts { border: 0; padding: 0; } .alba .x { position: absolute; right: 14px; top: 12px; }
.carta { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(20,14,36,.55); backdrop-filter: blur(4px); animation: albaIn .5s ease-out; padding: 16px; }
.carta .hoja { max-width: 560px; max-height: 86%; overflow-y: auto; padding: 28px 32px; border-radius: 20px; background: #f6edd9; color: #3a2a1c; box-shadow: 0 24px 70px rgba(0,0,0,.5), inset 0 0 0 1px #d9c9a4; font: 500 15px/1.7 var(--f-title); position: relative; }
.carta .hoja h3 { font: 700 22px var(--f-title); margin: 0 0 10px; } .carta .hoja p { margin: 0 0 10px; } .carta .hoja .firma { text-align: right; font-style: italic; margin-top: 14px; }
.carta .hoja .hanko { display: inline-block; width: 26px; height: 26px; border-radius: 6px; background: #b8341f; color: #fff6ee; font: 700 14px/26px var(--f-title); text-align: center; vertical-align: middle; margin-left: 8px; }
</style>

</head>
<body>
<div class="app">

<script>
(function () {
  'use strict';
  // ============================================================ base
  // resolución: píxeles de dispositivo por píxel lógico (1 estándar, 2 alta, 3 ultra). Todo el dibujo trabaja en coordenadas lógicas
  const S = (() => { try { const q = +localStorage.getItem('kaizen-q'); if (q === 1 || q === 2 || q === 3) return q; } catch (e) {} return 2; })();
  const EX = 70, DX = 320, WW = 640 + 2 * DX, WH = 432 + EX + 500, OX = 280 + DX, OY = 120 + EX;
  const P = (x, y) => [OX + (x - y) * 16, OY + (x + y) * 8];
  // lienzo con tamaño lógico w×h y resolución S: su contexto ya viene escalado
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * S)); c.height = Math.max(1, Math.round(h * S)); const gc = c.getContext.bind(c); c.getContext = t => { const g = gc(t); if (!c._i) { c._i = 1; g.setTransform(S, 0, 0, S, 0, 0); g.imageSmoothingEnabled = false; } return g; }; return c; };
  const blit = (g, c, x, y) => g.drawImage(c, x, y, c.width / S, c.height / S);
  const clr = g => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, g.canvas.width, g.canvas.height); g.restore(); };
  // búferes de vista: solo se renderiza lo que se ve (en píxeles de dispositivo)
  const world = document.createElement('canvas'), wg = world.getContext('2d');
  const scene = document.createElement('canvas'), sg = scene.getContext('2d');
  const VIEW = { vx: 0, vy: 0, fx: 0, fy: 0, w: 1, h: 1 }, VIEWL = { x: 0, y: 0, w: 1, h: 1 };
  function setView(vxL, vyL, wL, hL) {
    const vx = Math.floor(vxL * S), vy = Math.floor(vyL * S), w = Math.ceil(wL * S) + 2, h = Math.ceil(hL * S) + 2;
    if (world.width !== w || world.height !== h) { world.width = scene.width = w; world.height = scene.height = h; }
    VIEW.vx = vx; VIEW.vy = vy; VIEW.fx = vxL * S - vx; VIEW.fy = vyL * S - vy; VIEW.w = w; VIEW.h = h; VIEWL.x = vxL; VIEWL.y = vyL; VIEWL.w = wL; VIEWL.h = hL;
    for (const g of [wg, sg]) { g.setTransform(S, 0, 0, S, -vx, -vy); g.imageSmoothingEnabled = false; }
  }
  const blitView = (g, c) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(c, VIEW.vx, VIEW.vy, VIEW.w, VIEW.h, 0, 0, VIEW.w, VIEW.h); g.restore(); };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function poly(g, c, pts) {
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
    g.fillStyle = c;
    const n = pts.length, inv = 1 / S;
    for (let Y = Math.floor(y0 * S); Y < Math.ceil(y1 * S); Y++) {
      const yc = (Y + .5) * inv; let xl = Infinity, xr = -Infinity;

        const a = pts[i], b = pts[(i + 1) % n];

    if (r && r.name) return { kind: 'room', id: r.id };
    const lt = lotAtWorld(wx, wy); return lt && LS[lt.id].state !== 'built' ? { kind: 'lot', id: lt.id } : null;
  }
  function click(wx, wy) {
    // huevos de pascua del jardín
    { const c = P(catState.x, catState.y); if (Math.abs(wx - c[0]) < 8 && wy > c[1] - 11 && wy < c[1] + 2) { discover('gato'); spawn(c[0], c[1] - 10, 10, { cols: ['#ffb8d0', '#ff8aa8'], dir: -1.57, spread: 1.4, v: 22, g: -4, l: 1.4 }); catState.heart = 1.5; catState.mode = 'sit'; catState.t = 3; catState.clicks++; inscribe(catState.clicks % 3 === 1 ? 'Tama ronronea.' : catState.clicks % 3 === 2 ? 'Tama te mira. Una vez más…' : 'Tama se estira y sigue su camino.'); return; } }
    { const p = P(POND.cx, POND.cy); if (Math.abs(wx - p[0]) < 16 && Math.abs(wy - p[1]) < 14) { discover('estanque'); chime(5, .04); koiJump = 1; for (let i = 0; i < 4; i++) RIPPLE.push({ x: POND.cx + (rnd() - .5) * .4, y: POND.cy + (rnd() - .5) * .6, r: 0 }); inscribe(isW() ? 'El hielo cruje. Los koi duermen debajo.' : '¡Plic! Un koi salta.'); return; } }
    { const b = P(17.5, 6.5); if (Math.abs(wx - b[0]) < 5 && Math.abs(wy - (b[1] - 13)) < 5) { bellT = 1; discover('campana'); tone(880, 1.8, .06); tone(1760, .9, .02); AG.forEach(a => { if (a.state !== 'sleep' && a.state !== 'rest') { a.emote = { e: '?', t: 2 }; if (a.state === 'stand') { a.dir = 'front'; a.face = 1; } } }); inscribe('Rin. Todo el mundo mira hacia la entrada.'); return; } }
    { const t = P(20.2, 9.3); if (Math.abs(wx - t[0]) < 8 && wy > t[1] - 42 && wy < t[1] + 2) { toroBoost = 3; for (let i = 0; i < 26; i++) FLIES.push({ x: t[0], y: t[1] - 25, hx: t[0] + (rnd() - .5) * 60, hy: t[1] - 25 + (rnd() - .5) * 40, ph: rnd() * 6, l: 8 + rnd() * 6, forced: true }); inscribe(darkness(hourOf()) > .4 ? 'La linterna despierta a las luciérnagas.' : 'La linterna guarda su luz para la noche.'); return; } }
    { const p = P(20.3, 7.4); if (Math.abs(wx - p[0]) < 7 && wy > p[1] - 24 && wy < p[1] + 2) { discover('tanuki'); spawn(p[0], p[1] - 20, 12, { cols: ['#f6c25a', '#fff2b0'], v: 22, g: 10, l: 1.2 }); inscribe('El tanuki te guiña un ojo.'); return; } }
    if (isW()) { const p = P(7.2, 17.4); if (Math.abs(wx - p[0]) < 9 && wy > p[1] - 34 && wy < p[1] + 2) { inscribe('Un yuki-daruma vigila el jardín. No te quita ojo.'); return; } }
    if (moonPos && Math.hypot(wx - moonPos[0], wy - moonPos[1]) < 10) { rabbitT = 7; discover('luna'); spawn(moonPos[0], moonPos[1], 18, { cols: ['#dfe8ff', '#ffffff'], v: 22, g: 0, l: 1.4 }); inscribe('En la luna, un conejo machaca mochi.'); return; }
    const h = hit(wx, wy);
    if (h && h.kind === 'agent') { select(h.kind, h.id); const a = agent(h.id); if (a) reactAgent(a); return; }
    const ho = hotAt(wx, wy); if (ho) { ho.act(); return; }
    if (h) { select(h.kind, h.id); if (h.kind === 'room') { const r = room(h.id); if (r) reactRoom(r); } return; }
    const bo = bambooAt(wx, wy); if (bo) { bo.act(); return; }
    // suelo libre: brota una flor (solo fuera de la casa y de sus pabellones)
    const [tx, ty] = worldTile(wx, wy);
    if (zoneOf(Math.floor(tx), Math.floor(ty)) && !(tx > -1 && tx < 19 && ty > -1 && ty < 14) && streamNear(tx, ty) > .3 && Math.hypot((tx - POND.cx) / (POND.rx + .4), (ty - POND.cy) / (POND.ry + .4)) > 1) onGround(wx, wy);
  }
  // teclas secretas: Konami (tormenta de pétalos), «zen» (estiramientos), «ame» (lluvia) y «muda» (manual)
  let keys = '', konami = [];
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    konami.push(e.key); konami = konami.slice(-10); if (konami.join() === KONAMI.join()) { storm = 8; AG.forEach(a => { if (a.state !== 'sleep' && a.state !== 'rest') a.emote = { e: '!', t: 2 }; }); inscribe('Hanafubuki. Tormenta de pétalos.'); konami = []; }
    keys = (keys + (e.key.length === 1 ? e.key.toLowerCase() : '')).slice(-4);
    if (keys.endsWith('zen')) { stretchT = 5; inscribe('Todos a estirarse. Un uno por ciento mejor.'); keys = ''; }
    if (keys.endsWith('ame')) { rainT = 12; inscribe('Llueve sobre el jardín.'); keys = ''; }
    if (keys === 'yuki') { setSeason(4); keys = ''; }
    if (keys === 'muda') { document.body.classList.toggle('muda'); inscribe(document.body.classList.contains('muda') ? 'MUDA. Solo queda lo que trabaja.' : 'Vuelve todo.'); keys = ''; }
  });
  document.getElementById('logo').addEventListener('click', e => { const s = document.createElement('span'); s.className = 'plus'; s.textContent = '+1 %'; const r = e.currentTarget.getBoundingClientRect(); s.style.left = (r.left + 20 + scrollX) + 'px'; s.style.top = (r.top + scrollY - 4) + 'px'; document.body.appendChild(s); setTimeout(() => s.remove(), 600); });

  document.getElementById('b-snd').addEventListener('click', () => { SND.on = !SND.on; try { localStorage.setItem('kaizen-snd', SND.on ? '1' : '0'); } catch (e) {} paintBadges(); if (SND.on) chime(4, .05); });
  paintBadges();
  // ---------- Hiru / Yoru para la interfaz
  const root = document.documentElement, sysDark = matchMedia('(prefers-color-scheme: dark)');
  let forced = null; try { forced = localStorage.getItem('kaizen-modo'); } catch (e) {}
  if (forced === 'yoru') root.dataset.theme = 'dark'; else if (forced === 'hiru') root.dataset.theme = 'light';
  const isDark = () => root.dataset.theme === 'dark' || (root.dataset.theme !== 'light' && sysDark.matches);
  const setModeLabel = () => { document.getElementById('b-mode').textContent = isDark() ? 'Hiru' : 'Yoru'; };
  document.getElementById('b-mode').addEventListener('click', () => { const next = isDark() ? 'hiru' : 'yoru'; root.dataset.theme = next === 'yoru' ? 'dark' : 'light'; try { localStorage.setItem('kaizen-modo', next); } catch (e) {} setModeLabel(); });
  sysDark.addEventListener('change', setModeLabel);

  // ---------- nitidez y diagnóstico
  { const bq = document.getElementById('b-q'); bq.textContent = 'Nitidez ×' + S; bq.addEventListener('click', () => { const n = S === 2 ? 3 : S === 3 ? 1 : 2; try { localStorage.setItem('kaizen-q', String(n)); } catch (e) {} inscribe('Nitidez ×' + n + '. Recargando el jardín…'); setTimeout(() => { try { location.reload(); } catch (e) {} }, 400); }); }
  // diagnóstico de solo lectura (lo usan las pruebas y quien depure); no cambia nada del mundo
  window.KAIZEN = {
    S,
    info: () => ({ online: BK.online, parado: BK.parado, empresa: BK.empresa, events: BK.events, cur: Object.assign({}, BK.cur), gasto: BK.dinero && BK.dinero.gasto_eur, tarjetas: BK.tarjetas, season: SEASON,
      rooms: ROOMS.filter(r => !r.corridor).map(r => ({ id: r.id, name: r.name, cubo: r.cubo || null, locked: !!r.locked, nodata: !!r.nodata, annex: !!r.annex, wear: wearOf(r), health: r.health == null ? null : r.health })),
      agents: AG.map(a => ({ id: a.id, room: a.room, cur: a.cur, state: a.state, say: a.say && a.say.text, pos: a.pos.map(v => +v.toFixed(2)) })),
      lots: LOTS.map(l => ({ id: l.id, state: LS[l.id].state, cubo: LS[l.id].cubo })), drops: DROPS.length, obras: OBRA.length }),
    toScreen: (wx, wy) => { const [ox, oy] = origin(), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; return [r.left + (ox + wx * cam.k) / dpr, r.top + (oy + wy * cam.k) / dpr]; },
    fx: () => ({ sp: SP.length, rings: RINGS.length, bloom: BLOOMS.length, boats: BOATS.length, kicks: KICKS.length, found: [...FOUND], isles: ISLES.map(I => [I._x, I._y + EX, I.w]), sun: [sunInfo.x, sunInfo.y, sunInfo.a], furin: FURIN.map(f => [f.x, f.y]), hot: hoverHot ? hoverHot.r : null }),
    look: (wx, wy, k) => { follow = null; cam.anchor = null; cam.x = wx; cam.y = wy; if (k) cam.kt = Math.min(10, Math.max(kMin, k)); },
    sprite: (id, pose, frame, rank) => { try { return charSprite(id, pose || 'stand', frame || 0, rank || 0).toDataURL(); } catch (e) { return null; } },
    perf: () => ({ frame: +PERF.ms.toFixed(1), compose: +PERF.comp.toFixed(1), stalks: STALKS.length, objs: OBJ.length, buf: [world.width, world.height] })
  };

  // ---------- arranque
  TREES.push({ x: 2.2, y: 18.6, kind: 'sakura', ph: 1, c: null }, { x: 16.2, y: 18.4, kind: 'sakura', ph: 2.3, c: null }, { x: 22.4, y: 12.4, kind: 'maple', ph: .7, c: null }, { x: 20.2, y: 15.3, kind: 'pine', ph: 3.1, c: null }, { x: 33.4, y: 18.4, kind: 'sakura', ph: 4.2, c: null }, { x: -3.6, y: 21, kind: 'maple', ph: 5.1, c: null }, { x: 0.6, y: 27, kind: 'sakura', ph: 1.7, c: null }, { x: 11.5, y: 33, kind: 'pine', ph: 2.9, c: null }, { x: 28.5, y: 33, kind: 'pine', ph: .3, c: null }, { x: -8, y: 15.5, kind: 'sakura', ph: 3.6, c: null }, { x: 35, y: 8, kind: 'maple', ph: 4.7, c: null });
  // el mundo se construye tras el primer dibujo, para que se vea «Preparando el jardín…» y no un lienzo en blanco; después se pide la foto al backend
  setTimeout(() => { TREES.forEach(t => { t.c = treeCanvas(t.kind); }); buildStatic(); buildStalks(); buildObjects(); refreshDust(); const ld = document.getElementById('loading'); if (ld) ld.remove(); pollEstado(true); setInterval(() => { if (BK.loaded) pollEstado(false); }, 12000); }, 40);
  setModeLabel(); setLive();
  renderTab();
  new ResizeObserver(() => { fitCanvas(); }).observe(document.getElementById('stage'));
  fitCanvas(); home(); cam.k = cam.kt;
  setTimeout(() => { if (BK.online !== false) inscribe('Rueda o pellizca para acercarte. Arrastra para moverte.'); }, 600);
  const PERF = { ms: 0, comp: 0 }; let hinted = false;
  let t0 = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - t0) / 1000); t0 = now; const pf0 = performance.now();
    if (!paused) step(dt);
    if (follow) { const a = agent(follow); if (a) { const p = P(a.pos[0], a.pos[1]); cam.x += (p[0] - cam.x) * .12; cam.y += (p[1] - 14 - cam.y) * .12; } else follow = null; }
    stepCamera();
    const pf1 = performance.now(); composeScene(dt); PERF.comp += (performance.now() - pf1 - PERF.comp) * .1;
    present(); PERF.ms += (performance.now() - pf0 - PERF.ms) * .1;
    if (!hinted && T > 6 && PERF.ms > 42 && S > 1) { hinted = true; inscribe('Tu equipo va justo. Prueba «Nitidez ×1» abajo si notas tirones.'); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { t0 = t; requestAnimationFrame(frame); });
})();
</script>
