[pytest]
# Solo se colecta desde tests/. Sin esto, pytest recorre el repo entero y encuentra
# ficheros con el mismo basename en _workspace/f2_extract/tests/ y f47_extract/tests/
# (test_voz_pre_flight, test_f2_seguridad, test_f3_cableado, test_f4_entregabilidad,
# test_f7_csrf) -> "import file mismatch" y aborta la colección completa (A-07).
testpaths = tests

# Cinturón y tirantes: aunque alguien invoque pytest con una ruta explícita, estos
# directorios no se recorren nunca.
norecursedirs = _workspace _archivo .venv .git __pycache__ .pytest_cache data state

# pytest-asyncio: fija el scope del event loop para fixtures async. Sin esto, cada
# ejecución emite un PytestDeprecationWarning.
asyncio_default_fixture_loop_scope = function
